bot:
  estimated_rating: 2000
engine:
  path: "C:/path/to/stockfish.exe"
  analysis_depth: 12
  multipv: 4
safety:
  max_centipawn_loss: 80
  minimum_evaluation_centipawns: -30
  confirmation_depth: 16
behaviors:
  underpromotion:
    enabled: true
    required_when_safe: true
    max_centipawn_loss: 50
    priority: [knight, bishop, rook]
  winning_underpromotion:
    enabled: true
    complete_all_pawn_promotions: true
    minimum_best_evaluation: 500
    max_opponent_material: 5
    minimum_candidate_evaluation: 100
  early_sacrifice:
    enabled: true
    max_ply: 14
    min_candidates: 2
    max_candidates: 16
    max_centipawn_loss_at_level_0: 100
    max_centipawn_loss_at_level_100: 1100
    minimum_evaluation_at_level_0: 0
    minimum_evaluation_at_level_100: -1200
disrespect:
  base_level: 15
  rating_points_per_level: 10
  maximum_level: 100
lichess:
  enabled: false
  accept_challenges: false
  allowed_challengers: []
  allowed_variants: [standard]
  allowed_speeds: [blitz, rapid, classical]
  max_concurrent_games: 1
logging:
  directory: logs

# Cada movimento usa UCI. children são respostas alternativas ao lance anterior.
openings:
  - name: Bird sample
    color: white
    weight: 2
    max_opponent_rating: 1800
    enabled: false
    moves:
      - uci: f2f4
        children:
          - uci: d7d5
            children:
              - uci: g1f3
