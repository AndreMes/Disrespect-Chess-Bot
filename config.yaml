bot:
  estimated_rating: 2000
engine:
  path: "tools/stockfish/extracted/stockfish/stockfish-windows-x86-64-universal.exe"
  analysis_depth: 12
  multipv: 4
safety:
  # Um comportamento especial nunca pode perder mais que esta margem do melhor lance.
  max_centipawn_loss: 80
  # Também não aceite voluntariamente uma posição que o motor considere inferior.
  minimum_evaluation_centipawns: -30
  # Confirma comparações de risco com uma análise mais profunda.
  confirmation_depth: 16
behaviors:
  underpromotion:
    enabled: true
    max_centipawn_loss: 50
    # A primeira promoção segura encontrada nesta ordem é escolhida.
    priority: [knight, bishop, rook]
  early_sacrifice:
    enabled: true
    # Só procura ofertas de material até o início do sétimo lance do bot.
    max_ply: 14
    max_candidates: 8
    # Mais permissivo que a segurança normal, mas ainda recusa posição claramente perdida.
    max_centipawn_loss: 350
    minimum_evaluation_centipawns: -200
lichess:
  # Permanece desligado até você criar uma conta BOT e fornecer o token pelo ambiente.
  enabled: true
  accept_challenges: true
  # Só estes nomes de usuário podem desafiar o bot durante os testes iniciais.
  allowed_challengers: ["zAmazed"]
  allowed_variants: [standard]
  allowed_speeds: [blitz, rapid, classical]
  max_concurrent_games: 1
logging:
  directory: logs

# Cada movimento usa UCI. children são respostas alternativas ao lance anterior.
# As linhas desta primeira coleção são propositalmente curtas: elas acabam após
# o primeiro ou segundo lance excêntrico do bot e então devolvem a posição ao motor.
openings:
  # bot_moves contém somente os lances do bot; a escolha é aleatória e não
  # depende da resposta adversária. A sequência acaba se algum lance ficar ilegal.
  - { name: White Knight to a3, color: white, weight: 1, enabled: true, bot_moves: [b1a3] }
  - { name: White Knight to h3, color: white, weight: 1, enabled: true, bot_moves: [g1h3] }
  - { name: White Knight c3 back to b1, color: white, weight: 1, enabled: true, bot_moves: [b1c3, c3b1] }
  - { name: White Knight f3 back to g1, color: white, weight: 1, enabled: true, bot_moves: [g1f3, f3g1] }
  - { name: White g-pawn thrust, color: white, weight: 1, enabled: true, bot_moves: [g2g4] }
  - { name: White h-pawn thrust, color: white, weight: 1, enabled: true, bot_moves: [h2h4] }
  - { name: White a-pawn thrust, color: white, weight: 1, enabled: true, bot_moves: [a2a4] }
  - { name: White b-pawn thrust, color: white, weight: 1, enabled: true, bot_moves: [b2b4] }

  - { name: Black Knight to a6, color: black, weight: 1, enabled: true, bot_moves: [b8a6] }
  - { name: Black Knight to h6, color: black, weight: 1, enabled: true, bot_moves: [g8h6] }
  - { name: Black Knight c6 back to b8, color: black, weight: 1, enabled: true, bot_moves: [b8c6, c6b8] }
  - { name: Black Knight f6 back to g8, color: black, weight: 1, enabled: true, bot_moves: [g8f6, f6g8] }
  - { name: Black g-pawn thrust, color: black, weight: 1, enabled: true, bot_moves: [g7g5] }
  - { name: Black h-pawn thrust, color: black, weight: 1, enabled: true, bot_moves: [h7h5] }
  - { name: Black a-pawn thrust, color: black, weight: 1, enabled: true, bot_moves: [a7a5] }
  - { name: Black b-pawn thrust, color: black, weight: 1, enabled: true, bot_moves: [b7b5] }
