[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disrespect-bot"
version = "0.1.0"
description = "A configurable local foundation for the Disrespect chess bot"
requires-python = ">=3.10"
dependencies = ["python-chess>=1.999", "PyYAML>=6.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
